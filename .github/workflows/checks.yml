name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repository-checks:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: '0.12.9'
          enable-cache: false
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --frozen python scripts/check.py
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen python scripts/audit_evidence.py
      - run: uv run --frozen python scripts/security_check.py
      - run: git diff --exit-code
