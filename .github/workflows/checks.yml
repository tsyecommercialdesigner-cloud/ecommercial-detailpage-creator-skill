name: checks
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  repository-checks:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: '0.12.9'
          enable-cache: false
      - name: Prepare locked environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .eval-runs/ci -Force | Out-Null
          uv sync --locked --group dev --python 3.12 2>&1 | Tee-Object -FilePath .eval-runs/ci/setup.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: uv run --frozen python scripts/ci_check.py
      - run: git diff --exit-code
      - name: Preserve deterministic check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deterministic-check-evidence
          path: .eval-runs/ci/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
